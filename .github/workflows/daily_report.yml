name: Post queued paper to WordPress (no generation)

# 論文と査読報告書は、ローカルの Claude Code で作り、queue/ に入れて push する。
# このワークフローは、queue/index.json の「ready」の先頭を、2日以上あけて WordPress へ投稿するだけ。
# 言語モデル（Claude / Gemini / Ollama）は呼ばない。API キーも渡さない。
# 投稿の停止中は、リポジトリの変数 WP_PUBLISHING_PAUSED を 'true' のままにする（既定）。再開は 'false' にする。

on:
  # Scheduled runs (JST = UTC + 9)。再開するときは # を外す。毎朝 07:00 JST。キューは2日に1本しか進まない。
  # schedule:
  #   - cron: '0 22 * * *'

  # Manual execution from GitHub Actions UI
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (build the files but do not send the post or update the queue)'
        type: boolean
        required: false
        default: true
      publisher:
        description: 'Publishing target (WP_PUBLISHING_PAUSED=true switches wordpress_* to markdown_only)'
        type: choice
        options:
          - wordpress_mail
          - wordpress_rest
          - markdown_only
        default: wordpress_mail

permissions:
  contents: write

concurrency:
  group: post-queued-paper
  cancel-in-progress: false

jobs:
  post-queued-paper:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Japanese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-ipafont-gothic fonts-ipafont-mincho

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Post the next ready paper from the queue
        env:
          TZ: 'Asia/Tokyo'
          QUEUE_ONLY: 'true'
          BLOG_PUBLISHER_TYPE: ${{ inputs.publisher || 'wordpress_mail' }}
          WP_PUBLISHING_PAUSED: ${{ vars.WP_PUBLISHING_PAUSED || 'true' }}
          WP_POST_EMAIL: ${{ secrets.WP_POST_EMAIL }}
          WP_POST_STATUS: ${{ vars.WP_POST_STATUS || 'draft' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_PUBLISHER: ${{ inputs.publisher }}
        run: |
          ARGS="--from-queue"
          if [ "$INPUT_DRY_RUN" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ -n "$INPUT_PUBLISHER" ]; then
            ARGS="$ARGS --publisher $INPUT_PUBLISHER"
          fi
          echo "Executing: python -m src.main $ARGS"
          python -m src.main $ARGS

      - name: Upload Generated Assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: posted-paper-assets
          path: |
            reports/pdf/*.pdf
            reports/scripts/*.py
            temp/preview_post.html
            temp/preview_report.md
          if-no-files-found: ignore

      - name: Publish Summary to GitHub Step Summary
        if: always()
        run: |
          if [ -f temp/preview_report.md ]; then
            cat temp/preview_report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit & Push Reports, Queue State and History
        if: success() && inputs.dry_run != true
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action EduData"
          git add data/posted_reports.json data/REPORT_ARCHIVE.md reports/ queue/index.json
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto: post queued paper and update queue state [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi
