name: Daily Educational Open Data Analysis & Blog Auto-Poster

on:
  # Daily scheduled run (21:00 UTC = 06:00 JST / 毎朝6時)
  schedule:
    - cron: '0 21 * * *'

  # Manual execution from GitHub Actions UI
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry run (Simulate without sending blog post or updating remote history)'
        type: boolean
        required: false
        default: false
      force:
        description: 'Force run (Ignore rotation history and pick first dataset)'
        type: boolean
        required: false
        default: false
      topic:
        description: 'Filter topic: all / math (算数・数学) / info (情報・プログラミング)'
        type: choice
        options:
          - all
          - math
          - info
        default: all
      publisher:
        description: 'Publishing target (wordpress_mail / wordpress_rest / markdown_only)'
        type: choice
        options:
          - wordpress_mail
          - wordpress_rest
          - markdown_only
        default: wordpress_mail

permissions:
  contents: write

jobs:
  run-pipeline:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Japanese Fonts
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-cjk fonts-ipafont-gothic

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Execute Educational Open Data Pipeline
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_TEXT_MODEL: ${{ vars.GEMINI_TEXT_MODEL || 'gemini-2.5-flash' }}
          BLOG_PUBLISHER_TYPE: ${{ inputs.publisher || vars.BLOG_PUBLISHER_TYPE || 'wordpress_mail' }}
          WP_POST_EMAIL: ${{ secrets.WP_POST_EMAIL }}
          WP_POST_STATUS: ${{ vars.WP_POST_STATUS || 'publish' }}
          SMTP_HOST: ${{ secrets.SMTP_HOST || 'smtp.gmail.com' }}
          SMTP_PORT: ${{ secrets.SMTP_PORT || '587' }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASS: ${{ secrets.SMTP_PASS }}
          WP_SITE_URL: ${{ secrets.WP_SITE_URL }}
          WP_USER: ${{ secrets.WP_USER }}
          WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
          ESTAT_APP_ID: ${{ secrets.ESTAT_APP_ID }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_BRANCH: ${{ github.ref_name }}
          INPUT_DRY_RUN: ${{ inputs.dry_run }}
          INPUT_FORCE: ${{ inputs.force }}
          INPUT_TOPIC: ${{ inputs.topic }}
          INPUT_PUBLISHER: ${{ inputs.publisher }}
        run: |
          ARGS=""
          if [ "$INPUT_DRY_RUN" = "true" ] || [ "${{ github.event.inputs.dry_run }}" = "true" ]; then
            ARGS="$ARGS --dry-run"
          fi
          if [ "$INPUT_FORCE" = "true" ] || [ "${{ github.event.inputs.force }}" = "true" ]; then
            ARGS="$ARGS --force"
          fi
          if [ -n "$INPUT_TOPIC" ] && [ "$INPUT_TOPIC" != "all" ]; then
            ARGS="$ARGS --topic $INPUT_TOPIC"
          fi
          if [ -n "$INPUT_PUBLISHER" ]; then
            ARGS="$ARGS --publisher $INPUT_PUBLISHER"
          fi
          echo "Executing: python -m src.main $ARGS"
          python -m src.main $ARGS

      - name: Upload Generated Assets
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: generated-edu-report-assets
          path: |
            temp/*.png
            temp/*.pdf
            reports/pdf/*.pdf
            temp/preview_post.html
            temp/preview_report.md
          if-no-files-found: ignore

      - name: Publish Summary to GitHub Step Summary
        if: always()
        run: |
          if [ -f temp/preview_report.md ]; then
            cat temp/preview_report.md >> $GITHUB_STEP_SUMMARY
          fi

      - name: Commit & Push Generated Reports and History
        if: success() && inputs.dry_run != true
        run: |
          git config --local user.email "action@github.com"
          git config --local user.name "GitHub Action EduData"
          git add data/posted_reports.json data/REPORT_ARCHIVE.md reports/
          if git diff --staged --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Auto: Update educational data report archive [skip ci]"
            git push origin HEAD:${{ github.ref }}
          fi
